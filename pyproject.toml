[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nutrilog"
version = "0.3.0"
description = "Log explicit nutrient data directly to Google Health."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [
    { name = "Nutrilog Contributors" }
]
keywords = ["health", "nutrition", "google-health", "macros", "calories", "cli", "fitbit"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Monitoring",
    "Topic :: Utilities",
]
dependencies = [
    "click-agentcli>=0.1.0",
    "click>=8.1",
    "httpx>=0.27.0",
    "google-auth>=2.28.0",
    "google-auth-oauthlib>=1.2.0",
]


[project.scripts]
nutrilog = "nutrilog.cli:app"

[dependency-groups]
dev = ["pytest>=8.0.0", "ruff>=0.6"]

[tool.ruff]
line-length = 79

[tool.hatch.build.targets.wheel]
packages = ["nutrilog"]

# One manifest, mapped in at build time. A checked-in copy under nutrilog/skills/
# had to be synced by hand and shipped stale docs for two releases when it wasn't.
[tool.hatch.build.targets.wheel.force-include]
"SKILL.md" = "nutrilog/skills/nutrilog/SKILL.md"

[tool.pytest.ini_options]
testpaths = ["nutrilog"]
python_files = ["*_test.py"]
python_functions = ["test_*"]
